[project]
name = "mokli"
version = "0.1.0"
description = "Personal self-hosted agent for XAUUSD. The model proposes. Deterministic policy and risk decide."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "openai-agents==0.22.3",
  "openai>=3.0.0,<4",
  "anthropic==1.9.0",
  "claude-agent-sdk==0.2.161",
  "google-genai==2.25.0",
  "google-adk==2.10.0",
  "ollama==0.6.3",
  "openrouter==1.3.4",
  "zai-sdk==0.2.3",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "sqlmodel==0.0.47",
  "alembic==1.20.0",
  "apscheduler==3.11.3",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "pyotp==2.10.0",
  "cryptography==50.0.1",
  "mcp==2.2.0",
  "pillow==11.3.0",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9", "mypy==1.18.2"]
mt5 = ["mt5linux==0.2.4"]

[project.scripts]
mokli = "mokli.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["mokli"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
follow_imports = "skip"
