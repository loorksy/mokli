name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src/mokli
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: web
        run: npm install && npm run typecheck
