name: mokli

services:
  mokli:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mokli:paper
    container_name: mokli
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8787"
    env_file:
      - ../.env
    environment:
      MOKLI_HOST: "0.0.0.0"
      MOKLI_PORT: "8787"
      MOKLI_DATA_DIR: /data
      MOKLI_LIVE: "0"
      MOKLI_CORS_ORIGINS: "https://mokli.lork.cloud"
    volumes:
      - mokli-data:/data
      - ../downloads:/app/web/dist/downloads:ro

volumes:
  mokli-data:
    name: mokli-data
