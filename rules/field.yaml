- id: field.190
  category: execution
  title_en: Flexibility when the market changes. If gold suddenly reverses and breaks
    structure, drop the bullish bias immediately. Do not cling to the previous analysis.
  title_ar: 'التنفيذ: Flexibility when the market changes. If gold suddenly reverses
