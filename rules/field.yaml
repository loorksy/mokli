- id: field.001
  category: entry
  title_en: Move past classic support and resistance. The agent does not have to wait
    for a touch of a horizontal line. In strong trends, gold often reacts from dynamic
    trendlines or from liquidity gaps in the middle of the distance.
  title_ar: 'الدخول: Move past classic support and resistance. The agent does not
    have to wait for a touch of a horizontal line. In strong trends, gold often reacts
    from dynamic trendlines or from liquidity gaps in the middle of the distance.'
  type: detector
  params: {}
  default_enabled: true
  weight: 1
- id: field.002
  category: entry
  title_en: Immediate entry without waiting. If buy or sell conditions are complete
    and liquidity has already been swept, send a market entry. Do not wait for extra
    downside or upside that misses the move.
  title_ar: 'الدخول: Immediate entry without waiting. If buy or sell conditions are
    complete and liquidity has already been swept, send a market entry. Do not wait
    for extra downside or upside that misses the move.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.003
  category: entry
  title_en: Distance-versus-target contradiction. If entry requires a 100-point pullback
    to a level, while the total target is only 100 points, the trade is logically
    inconsistent. Priority goes to entering with current momentum.
  title_ar: 'الدخول: Distance-versus-target contradiction. If entry requires a 100-point
    pullback to a level, while the total target is only 100 points, the trade is logically
    inconsistent. Priority goes to entering with current momentum.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.004
  category: entry
  title_en: Anticipatory entry before the close. On explosive gold momentum candles,
    waiting for the close is not always required. Waiting can consume 60% of the expected
    range.
  title_ar: 'الدخول: Anticipatory entry before the close. On explosive gold momentum
    candles, waiting for the close is not always required. Waiting can consume 60%
    of the expected range.'
  type: detector
  params: {}
  default_enabled: true
  weight: 1
- id: field.005
  category: entry
  title_en: Incomplete retracement (front-running). Institutions often place orders
    several points before support and resistance. Open an entry window that starts
    15 to 30 gold points before the level.
  title_ar: 'الدخول: Incomplete retracement (front-running). Institutions often place
    orders several points before support and resistance. Open an entry window that
    starts 15 to 30 gold points before the level.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.006
  category: entry
  title_en: Enter the liquidity gap (FVG), not the high. In an uptrend, gold often
    turns from the first fair value gap above the broken high, rather than falling
    back to retest that high.
  title_ar: 'الدخول: Enter the liquidity gap (FVG), not the high. In an uptrend, gold
    often turns from the first fair value gap above the broken high, rather than falling
    back to retest that high.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.007
  category: entry
  title_en: Entry with a counter engulfing candle. If prior candles drifted lower
    and a strong bullish candle engulfs two of them, that is an immediate buy. A support
    touch is not required.
  title_ar: 'الدخول: Entry with a counter engulfing candle. If prior candles drifted
    lower and a strong bullish candle engulfs two of them, that is an immediate buy.
    A support touch is not required.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.008
  category: entry
  title_en: Direct breakout entry during liquidity hours. At the London or New York
    open, a sharp break of the Asian range is treated as a momentum entry. Do not
    wait for a pullback.
  title_ar: 'الدخول: Direct breakout entry during liquidity hours. At the London or
    New York open, a sharp break of the Asian range is treated as a momentum entry.
    Do not wait for a pullback.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.009
  category: entry
  title_en: Entry at equilibrium. In large impulse waves, the 50% level of the wave
    is a preferred entry even if it does not match a prior high or low.
  title_ar: 'الدخول: Entry at equilibrium. In large impulse waves, the 50% level of
    the wave is a preferred entry even if it does not match a prior high or low.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.010
  category: entry
  title_en: Two timeframes agreeing on timing. If an M15 reversal pattern forms while
    H1 is mid-candle in a directional candle, priority is the intraday entry in the
    H1 direction.
  title_ar: 'الدخول: Two timeframes agreeing on timing. If an M15 reversal pattern
    forms while H1 is mid-candle in a directional candle, priority is the intraday
    entry in the H1 direction.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.011
  category: entry
  title_en: Fan-line entry. When gold’s decline or rally accelerates, build the entry
    on the steeper trendline, not the slow primary trendline.
  title_ar: 'الدخول: Fan-line entry. When gold’s decline or rally accelerates, build
    the entry on the steeper trendline, not the slow primary trendline.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.012
  category: entry
  title_en: Cancel a conditional entry when time stalls. If price has not reached
    the conditional entry zone within 4 hours, cancel the idea. A break of the zone
    is then more likely than a bounce.
  title_ar: 'الدخول: Cancel a conditional entry when time stalls. If price has not
    reached the conditional entry zone within 4 hours, cancel the idea. A break of
    the zone is then more likely than a bounce.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.013
  category: entry
  title_en: Entry from the news-candle low. The candle produced by an economic release
    becomes support by itself. Enter on a touch of that candle’s wick, not by waiting
    for the day’s low.
  title_ar: 'الدخول: Entry from the news-candle low. The candle produced by an economic
    release becomes support by itself. Enter on a touch of that candle’s wick, not
    by waiting for the day’s low.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.014
  category: entry
  title_en: Entry on price absorption. Repeated lower wicks inside a tight price area
    are an immediate buy signal. Drawn technical lines are not required.
  title_ar: 'الدخول: Entry on price absorption. Repeated lower wicks inside a tight
    price area are an immediate buy signal. Drawn technical lines are not required.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.015
  category: entry
  title_en: “Break the minor trendline” entry. During a correction, a break of the
    minor descending trendline is the buy signal in the direction of the higher uptrend.
  title_ar: 'الدخول: “Break the minor trendline” entry. During a correction, a break
    of the minor descending trendline is the buy signal in the direction of the higher
    uptrend.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.016
  category: entry
  title_en: Do not wait for a pullback in a steep trend. When gold’s rally angle exceeds
    60 degrees, waiting for a deep pullback misses the entire rally.
  title_ar: 'الدخول: Do not wait for a pullback in a steep trend. When gold’s rally
    angle exceeds 60 degrees, waiting for a deep pullback misses the entire rally.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.017
  category: entry
  title_en: Entry on round-number touches. Levels such as 2400 or 2450 are automatic
    psychological entry zones if a reversal candle prints there, even without prior
    support.
  title_ar: 'الدخول: Entry on round-number touches. Levels such as 2400 or 2450 are
    automatic psychological entry zones if a reversal candle prints there, even without
    prior support.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.018
  category: entry
  title_en: Entry after a bearish pattern fails. If a double top fails to push price
    down and price breaks the neckline upward, activate the opposite buy immediately.
  title_ar: 'الدخول: Entry after a bearish pattern fails. If a double top fails to
    push price down and price breaks the neckline upward, activate the opposite buy
    immediately.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.019
  category: entry
  title_en: Entry conditioned on candle sequence. Three rising candles with expanding
    volume (Three White Soldiers) after chop are a sufficient entry reason. Indicators
    are not required.
  title_ar: 'الدخول: Entry conditioned on candle sequence. Three rising candles with
    expanding volume (Three White Soldiers) after chop are a sufficient entry reason.
    Indicators are not required.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.020
  category: entry
  title_en: Reclaim entry. A drop below support followed by a fast close back above
    it in the same candle is an immediate buy.
  title_ar: 'الدخول: Reclaim entry. A drop below support followed by a fast close
    back above it in the same candle is an immediate buy.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.021
  category: entry
  title_en: Hourly-close entry. Enter at minute 59 of the hour if that candle confirms
    a break of an important level, to avoid slippage in the first minute of the new
    hour.
  title_ar: 'الدخول: Hourly-close entry. Enter at minute 59 of the hour if that candle
    confirms a break of an important level, to avoid slippage in the first minute
    of the new hour.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.022
  category: entry
  title_en: Entry along the fast moving average. In strong trends, a gold reaction
    from the 20 EMA is enough. Prior lows are not required.
  title_ar: 'الدخول: Entry along the fast moving average. In strong trends, a gold
    reaction from the 20 EMA is enough. Prior lows are not required.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.023
  category: entry
  title_en: Counter-entry after the daily range is exhausted. If gold has already
    moved 150% of its average daily range (ADR), a counter-entry is justified on the
    first intraday reversal candle.
  title_ar: 'الدخول: Counter-entry after the daily range is exhausted. If gold has
    already moved 150% of its average daily range (ADR), a counter-entry is justified
    on the first intraday reversal candle.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.024
  category: entry
  title_en: Split-order entry. Split the entry into two clips (a market order and
    a pending order 20 points away) instead of missing the move or putting full size
    on one price.
  title_ar: 'الدخول: Split-order entry. Split the entry into two clips (a market order
    and a pending order 20 points away) instead of missing the move or putting full
    size on one price.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.025
  category: entry
  title_en: Buy the broken prior high that has flipped to support. The classic role-reversal
    rule is used only if the reaction is fast and the rejection candle is clear.
  title_ar: 'الدخول: Buy the broken prior high that has flipped to support. The classic
    role-reversal rule is used only if the reaction is fast and the rejection candle
    is clear.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.026
  category: stop
  title_en: The stop is not the support line. Placing the stop directly under classic
    support or a classic low is a serious error. That zone is where market makers
    prefer to run liquidity.
  title_ar: 'وقف الخسارة: The stop is not the support line. Placing the stop directly
    under classic support or a classic low is a serious error. That zone is where
    market makers prefer to run liquidity.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.027
  category: stop
  title_en: A hit stop can become the next entry. If the stop is tagged by a wick
    and price quickly closes back inside the range, the old stop level is itself the
    better new entry.
  title_ar: 'وقف الخسارة: A hit stop can become the next entry. If the stop is tagged
    by a wick and price quickly closes back inside the range, the old stop level is
    itself the better new entry.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.028
  category: stop
  title_en: Mandatory buffer zone. Always add a protection margin under lows of at
    least 25 to 40 gold points, to absorb random noise.
  title_ar: 'وقف الخسارة: Mandatory buffer zone. Always add a protection margin under
    lows of at least 25 to 40 gold points, to absorb random noise.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.029
  category: stop
  title_en: ATR-based stop. Stop distance must be a multiple of true volatility (the
    source left the example multiple blank), not a fixed point count.
  title_ar: 'وقف الخسارة: ATR-based stop. Stop distance must be a multiple of true
    volatility (the source left the example multiple blank), not a fixed point count.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.030
  category: stop
  title_en: Stop beyond the explosive candle. On sells, place the stop above the wick
    of the candle that caused the break, not above a distant historical high.
  title_ar: 'وقف الخسارة: Stop beyond the explosive candle. On sells, place the stop
    above the wick of the candle that caused the break, not above a distant historical
    high.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.031
  category: stop
  title_en: Structural stop, not a point stop. A fixed stop (for example “always 30
    points”) is abolished. The stop sits at the price that invalidates the technical
    idea completely.
  title_ar: 'وقف الخسارة: Structural stop, not a point stop. A fixed stop (for example
    “always 30 points”) is abolished. The stop sits at the price that invalidates
    the technical idea completely.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.032
  category: stop
  title_en: Do not park the stop on round numbers. Market makers target clean numbers.
    Place the stop on awkward fractions (for example 2447.80 instead of 2450.00).
  title_ar: 'وقف الخسارة: Do not park the stop on round numbers. Market makers target
    clean numbers. Place the stop on awkward fractions (for example 2447.80 instead
    of 2450.00).'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.033
  category: stop
  title_en: Stop on a dynamic trendline. On some trades, a candle close through the
    trendline is the stop criterion, not a fixed numeric price.
  title_ar: 'وقف الخسارة: Stop on a dynamic trendline. On some trades, a candle close
    through the trendline is the stop criterion, not a fixed numeric price.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.034
  category: stop
  title_en: Tighten the stop when a confirmation candle prints. Once price launches
    and prints a momentum candle in the trade direction, pull the stop immediately
    behind that candle’s low to cut risk.
  title_ar: 'وقف الخسارة: Tighten the stop when a confirmation candle prints. Once
    price launches and prints a momentum candle in the trade direction, pull the stop
    immediately behind that candle’s low to cut risk.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.035
  category: stop
  title_en: Moving the stop backward is forbidden. Under no circumstance may the stop
    be widened after entry to accept a larger loss than planned.
  title_ar: 'وقف الخسارة: Moving the stop backward is forbidden. Under no circumstance
    may the stop be widened after entry to accept a larger loss than planned.'
  type: guardrail
  params: {}
  default_enabled: true
  weight: 1
- id: field.036
  category: stop
  title_en: Time stop. If gold opens a trade and chops in a dead range for more than
    3 hours without launching, close the contract or tighten the stop in case of a
    reversal spike.
  title_ar: 'وقف الخسارة: Time stop. If gold opens a trade and chops in a dead range
    for more than 3 hours without launching, close the contract or tighten the stop
    in case of a reversal spike.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.037
  category: stop
  title_en: Stop behind a liquidity pool. Place the stop a safe distance behind equal
    lows. Those lows attract candle wicks.
  title_ar: 'وقف الخسارة: Stop behind a liquidity pool. Place the stop a safe distance
    behind equal lows. Those lows attract candle wicks.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.038
  category: stop
  title_en: Breakeven rule. Move the stop to entry only after price has traveled a
    distance equal to the stop itself and a new low has formed on M15. (The source
    had an empty parenthesis after “the stop itself.”)
  title_ar: 'وقف الخسارة: Breakeven rule. Move the stop to entry only after price
    has traveled a distance equal to the stop itself and a new low has formed on M15.
    (The source had an empty parenthesis after “the stop itself.”)'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.039
  category: stop
  title_en: Protect profit near the high. If the trade has reached 70% of the target,
    place a profit-protection stop at 50% of the move so the market cannot turn a
    winner into a loser.
  title_ar: 'وقف الخسارة: Protect profit near the high. If the trade has reached 70%
    of the target, place a profit-protection stop at 50% of the move so the market
    cannot turn a winner into a loser.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.040
  category: stop
  title_en: Order-block buffer. Place the stop 15 points beyond the end of the institutional
    order block, not exactly on it.
  title_ar: 'وقف الخسارة: Order-block buffer. Place the stop 15 points beyond the
    end of the institutional order block, not exactly on it.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.041
  category: stop
  title_en: Separate the sell stop from the spread. On sells, add the spread width
    at the time of exit to the stop distance, so a phantom spread does not knock the
    trade out.
  title_ar: 'وقف الخسارة: Separate the sell stop from the spread. On sells, add the
    spread width at the time of exit to the stop distance, so a phantom spread does
    not knock the trade out.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.042
  category: stop
  title_en: Dynamic chandelier exit. Use the highest high of the last 10 candles minus
    an ATR multiple as a trailing stop that follows price.
  title_ar: 'وقف الخسارة: Dynamic chandelier exit. Use the highest high of the last
    10 candles minus an ATR multiple as a trailing stop that follows price.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.043
  category: stop
  title_en: Stop behind the Asian high. If gold is sold after an Asian-session liquidity
    sweep, place the stop 10 points above the highest wick of the sweep candle.
  title_ar: 'وقف الخسارة: Stop behind the Asian high. If gold is sold after an Asian-session
    liquidity sweep, place the stop 10 points above the highest wick of the sweep
    candle.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.044
  category: stop
  title_en: Do not place the stop inside open gaps. Never put a stop in the middle
    of an open FVG. Price will return to fill it.
  title_ar: 'وقف الخسارة: Do not place the stop inside open gaps. Never put a stop
    in the middle of an open FVG. Price will return to fill it.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.045
  category: stop
  title_en: Intraday momentum-break stop. Exit if two consecutive candles close against
    the trade on M5 with rising momentum, even before the original stop is hit.
  title_ar: 'وقف الخسارة: Intraday momentum-break stop. Exit if two consecutive candles
    close against the trade on M5 with rising momentum, even before the original stop
    is hit.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.046
  category: stop
  title_en: Do not move to breakeven too early. Moving the stop to entry before a
    minor swing high is cleared gets the trade tagged by noise before the move to
    target.
  title_ar: 'وقف الخسارة: Do not move to breakeven too early. Moving the stop to entry
    before a minor swing high is cleared gets the trade tagged by noise before the
    move to target.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.047
  category: stop
  title_en: Portfolio-percent stop. The distance from entry to stop must equal exactly
    1% or 2% of equity in code, by adjusting lot size.
  title_ar: 'وقف الخسارة: Portfolio-percent stop. The distance from entry to stop
    must equal exactly 1% or 2% of equity in code, by adjusting lot size.'
  type: guardrail
  params: {}
  default_enabled: true
  weight: 1
- id: field.048
  category: stop
  title_en: Close-based reference stop. In some cases the stop is programmed as “an
    hourly candle close below the level,” not a fast wick touch.
  title_ar: 'وقف الخسارة: Close-based reference stop. In some cases the stop is programmed
    as “an hourly candle close below the level,” not a fast wick touch.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.049
  category: stop
  title_en: Protect trades into news. Five minutes before a hot release, the stop
    must sit in an area clear of liquidity gaps, to reduce slippage.
  title_ar: 'وقف الخسارة: Protect trades into news. Five minutes before a hot release,
    the stop must sit in an area clear of liquidity gaps, to reduce slippage.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.050
  category: stop
  title_en: Split stops on split contracts. When entering with two contracts, the
    first stop can be tight and the second can sit behind the larger structural low,
    to spread risk.
  title_ar: 'وقف الخسارة: Split stops on split contracts. When entering with two contracts,
    the first stop can be tight and the second can sit behind the larger structural
    low, to spread risk.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.051
  category: stop
  title_en: Stop on a channel midline break. Inside a price channel, a break of the
    equidistant median is an early stop, before the channel extreme.
  title_ar: 'وقف الخسارة: Stop on a channel midline break. Inside a price channel,
    a break of the equidistant median is an early stop, before the channel extreme.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.052
  category: stop
  title_en: Overnight safety stop. Before the rollover, widen the stop by an extra
    20 points to absorb the temporary spread expansion.
  title_ar: 'وقف الخسارة: Overnight safety stop. Before the rollover, widen the stop
    by an extra 20 points to absorb the temporary spread expansion.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.053
  category: stop
  title_en: Stop behind an inverted hammer (shooting star). On a sell, place the stop
    10 points above the highest point of the shooting-star wick.
  title_ar: 'وقف الخسارة: Stop behind an inverted hammer (shooting star). On a sell,
    place the stop 10 points above the highest point of the shooting-star wick.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.054
  category: stop
  title_en: Stop based on supply/demand balance. On a buy, place the stop under the
    demand zone that absorbed the last full downswing.
  title_ar: 'وقف الخسارة: Stop based on supply/demand balance. On a buy, place the
    stop under the demand zone that absorbed the last full downswing.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.055
  category: stop
  title_en: Protective exit on an opposite pattern. Cancel the trade and hit the stop
    manually if a clear head-and-shoulders reversal forms on H1.
  title_ar: 'وقف الخسارة: Protective exit on an opposite pattern. Cancel the trade
    and hit the stop manually if a clear head-and-shoulders reversal forms on H1.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.056
  category: retest
  title_en: A retest is not mandatory. In genuine gold explosions, price runs away
    with no retest of the broken level. Waiting misses the trade.
  title_ar: 'إعادة الاختبار: A retest is not mandatory. In genuine gold explosions,
    price runs away with no retest of the broken level. Waiting misses the trade.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.057
  category: retest
  title_en: A retest can be evidence of reversal. If price drifts slowly and hesitantly
    back to the broken level and bearish candles start to dominate, this is often
    not a retest. It is a failed break and a real reversal.
  title_ar: 'إعادة الاختبار: A retest can be evidence of reversal. If price drifts
    slowly and hesitantly back to the broken level and bearish candles start to dominate,
    this is often not a retest. It is a failed break and a real reversal.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.058
  category: retest
  title_en: Deep retest. Gold often pushes back through a broken resistance to retest
    deeper demand underneath before rallying.
  title_ar: 'إعادة الاختبار: Deep retest. Gold often pushes back through a broken
    resistance to retest deeper demand underneath before rallying.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.059
  category: retest
  title_en: Speed of the test candle. A successful retest candle must be fast and
    rejected with a long wick. Full-bodied candles that settle on the level mean the
    breakout failed.
  title_ar: 'إعادة الاختبار: Speed of the test candle. A successful retest candle
    must be fast and rejected with a long wick. Full-bodied candles that settle on
    the level mean the breakout failed.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.060
  category: retest
  title_en: Retest the trendline, not the horizontal line. Price may ignore the horizontal
    level and retest a previously broken sloping trendline, then launch from it.
  title_ar: 'إعادة الاختبار: Retest the trendline, not the horizontal line. Price
    may ignore the horizontal level and retest a previously broken sloping trendline,
    then launch from it.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.061
  category: retest
  title_en: Fake retest used to grab liquidity. A return to the broken zone may exist
    only to trigger traders’ pending buy orders, then dump hard and trap them.
  title_ar: 'إعادة الاختبار: Fake retest used to grab liquidity. A return to the broken
    zone may exist only to trigger traders’ pending buy orders, then dump hard and
    trap them.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.062
  category: retest
  title_en: A failed retest is a sell. When price fails to bounce from the retest
    level and trades back through it, flip immediately to a sell with the new direction.
  title_ar: 'إعادة الاختبار: A failed retest is a sell. When price fails to bounce
    from the retest level and trades back through it, flip immediately to a sell with
    the new direction.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.063
  category: retest
  title_en: Retest on a smaller timeframe. What looks like a straight breakout on
    H1 often contains a complete, clean retest on M1 or M5.
  title_ar: 'إعادة الاختبار: Retest on a smaller timeframe. What looks like a straight
    breakout on H1 often contains a complete, clean retest on M1 or M5.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.064
  category: retest
  title_en: Volume effect on the test. A retest on weak tick volume is the safer and
    more credible continuation.
  title_ar: 'إعادة الاختبار: Volume effect on the test. A retest on weak tick volume
    is the safer and more credible continuation.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.065
  category: retest
  title_en: Fibonacci retest. Gold prefers to retest the 61.8% Fibonacci of the broken
    wave rather than the zero point of the break.
  title_ar: 'إعادة الاختبار: Fibonacci retest. Gold prefers to retest the 61.8% Fibonacci
    of the broken wave rather than the zero point of the break.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.066
  category: retest
  title_en: Right-shoulder test. In head-and-shoulders patterns, price may never retest
    the neckline. It may simply fall after the right shoulder forms.
  title_ar: 'إعادة الاختبار: Right-shoulder test. In head-and-shoulders patterns,
    price may never retest the neckline. It may simply fall after the right shoulder
    forms.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.067
  category: retest
  title_en: Repeated retests weaken the level. Three returns to the same level do
    not prove strength. They show buy orders being consumed and a break getting closer.
  title_ar: 'إعادة الاختبار: Repeated retests weaken the level. Three returns to the
    same level do not prove strength. They show buy orders being consumed and a break
    getting closer.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.068
  category: retest
  title_en: Time-conditioned retest. If the breakout candle took one minute and the
    retest candle took 30 minutes of hesitant decline, that is a healthy pullback.
  title_ar: 'إعادة الاختبار: Time-conditioned retest. If the breakout candle took
    one minute and the retest candle took 30 minutes of hesitant decline, that is
    a healthy pullback.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.069
  category: retest
  title_en: Retest zones, not lines. Treat retest levels as a price band of 15 to
    30 points, not a single number.
  title_ar: 'إعادة الاختبار: Retest zones, not lines. Treat retest levels as a price
    band of 15 to 30 points, not a single number.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.070
  category: retest
  title_en: Weekly opening-gap retest. Gaps left at the Monday open are later retest
    targets that tend to be filled during the week.
  title_ar: 'إعادة الاختبار: Weekly opening-gap retest. Gaps left at the Monday open
    are later retest targets that tend to be filled during the week.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.071
  category: retest
  title_en: Runaway breakout with no test. If the breakout is accompanied by a strong
    opposite move in DXY, gold will fall with no retest of the highs.
  title_ar: 'إعادة الاختبار: Runaway breakout with no test. If the breakout is accompanied
    by a strong opposite move in DXY, gold will fall with no retest of the highs.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.072
  category: retest
  title_en: Confirm the retest with reversal candles. Do not enter a retest just because
    price touched the level. Require an M15 pin bar or engulfing candle that confirms
    rejection.
  title_ar: 'إعادة الاختبار: Confirm the retest with reversal candles. Do not enter
    a retest just because price touched the level. Require an M15 pin bar or engulfing
    candle that confirms rejection.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.073
  category: retest
  title_en: Retest of a broken Asian low. When gold breaks the Asian-session low at
    the London open, the maximum bounce is a tag of that same low before the sharp
    decline.
  title_ar: 'إعادة الاختبار: Retest of a broken Asian low. When gold breaks the Asian-session
    low at the London open, the maximum bounce is a tag of that same low before the
    sharp decline.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.074
  category: retest
  title_en: Mid-air retest. Price may turn 20 points before the broken support and
    only test the nearest moving average.
  title_ar: 'إعادة الاختبار: Mid-air retest. Price may turn 20 points before the broken
    support and only test the nearest moving average.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.075
  category: retest
  title_en: Retest of parallel trendlines. After a descending channel breaks, price
    often retests the channel’s outer ceiling as new support.
  title_ar: 'إعادة الاختبار: Retest of parallel trendlines. After a descending channel
    breaks, price often retests the channel’s outer ceiling as new support.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.076
  category: retest
  title_en: Psychological-level retest. Holding above a level such as 2400.00 after
    clearing it is stronger confirmation than retesting a random high.
  title_ar: 'إعادة الاختبار: Psychological-level retest. Holding above a level such
    as 2400.00 after clearing it is stronger confirmation than retesting a random
    high.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.077
  category: retest
  title_en: Retest after a storm news release. News shocks leave violent break levels.
    Those levels are often retested calmly after the session ends.
  title_ar: 'إعادة الاختبار: Retest after a storm news release. News shocks leave
    violent break levels. Those levels are often retested calmly after the session
    ends.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.078
  category: retest
  title_en: All-time-high retest. When gold prints a new all-time high, the retest
    may be a long sideways range rather than a sharp drop.
  title_ar: 'إعادة الاختبار: All-time-high retest. When gold prints a new all-time
    high, the retest may be a long sideways range rather than a sharp drop.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.079
  category: retest
  title_en: Failed test in exhaustion zones. If RSI is deeply oversold on H4, any
    retest of a broken resistance will turn into a buy explosion.
  title_ar: 'إعادة الاختبار: Failed test in exhaustion zones. If RSI is deeply oversold
    on H4, any retest of a broken resistance will turn into a buy explosion.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.080
  category: retest
  title_en: Cancel the retest idea when the range is too wide. If the retest decline
    exceeds 78.6% of the breakout leg, cancel the scenario. The break was fully false.
  title_ar: 'إعادة الاختبار: Cancel the retest idea when the range is too wide. If
    the retest decline exceeds 78.6% of the breakout leg, cancel the scenario. The
    break was fully false.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.081
  category: trend
  title_en: Multiple trendlines on the same chart. An inner steep trendline and an
    outer primary trendline can both be drawn on the same candles. Entry starts from
    the inner line.
  title_ar: 'خطوط الاتجاه: Multiple trendlines on the same chart. An inner steep trendline
    and an outer primary trendline can both be drawn on the same candles. Entry starts
    from the inner line.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.082
  category: trend
  title_en: A trendline is a zone, not a hairline. Draw it as a price band that contains
    both wicks and bodies, so gold’s momentary wick pierces are absorbed.
  title_ar: 'خطوط الاتجاه: A trendline is a zone, not a hairline. Draw it as a price
    band that contains both wicks and bodies, so gold’s momentary wick pierces are
    absorbed.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.083
  category: trend
  title_en: Bounce from the trendline without touching support. Gold often ignores
    horizontal levels completely and reverses on a touch of a rising trendline.
  title_ar: 'خطوط الاتجاه: Bounce from the trendline without touching support. Gold
    often ignores horizontal levels completely and reverses on a touch of a rising
    trendline.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.084
  category: trend
  title_en: Third-touch rule. The third touch of a trendline is the strongest and
    the highest-probability quick profit. The fourth and fifth touches carry a high
    break risk.
  title_ar: 'خطوط الاتجاه: Third-touch rule. The third touch of a trendline is the
    strongest and the highest-probability quick profit. The fourth and fifth touches
    carry a high break risk.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.085
  category: trend
  title_en: A trendline break is not automatically a reversal. A break of gold’s rising
    trendline often produces a sideways accumulation path, not necessarily a sharp
    decline.
  title_ar: 'خطوط الاتجاه: A trendline break is not automatically a reversal. A break
    of gold’s rising trendline often produces a sideways accumulation path, not necessarily
    a sharp decline.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.086
  category: trend
  title_en: Adjusted trendlines. If a wick pierces the trendline and the candle closes
    back above it, redraw the line to include that wick as the new slope.
  title_ar: 'خطوط الاتجاه: Adjusted trendlines. If a wick pierces the trendline and
    the candle closes back above it, redraw the line to include that wick as the new
    slope.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.087
  category: trend
  title_en: Parallel twin trendline. A line parallel to the trendline across the opposite
    swings creates a channel. A tag of the channel ceiling is a mandatory profit target.
  title_ar: 'خطوط الاتجاه: Parallel twin trendline. A line parallel to the trendline
    across the opposite swings creates a channel. A tag of the channel ceiling is
    a mandatory profit target.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.088
  category: trend
  title_en: Accelerating departure from a flat trendline. Price racing away from the
    trendline at a right angle signals a nearby explosion that ends with a collapse
    back toward the line.
  title_ar: 'خطوط الاتجاه: Accelerating departure from a flat trendline. Price racing
    away from the trendline at a right angle signals a nearby explosion that ends
    with a collapse back toward the line.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.089
  category: trend
  title_en: Minor trendline break as confirmation. Do not buy a horizontal support
    touch until the small descending trendline breaks on the 5-minute chart.
  title_ar: 'خطوط الاتجاه: Minor trendline break as confirmation. Do not buy a horizontal
    support touch until the small descending trendline breaks on the 5-minute chart.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.090
  category: trend
  title_en: The market-maker’s fake trendline. Trendlines that are obvious to beginners
    are drawn so they can be broken and the stops parked just behind them can be taken.
  title_ar: 'خطوط الاتجاه: The market-maker’s fake trendline. Trendlines that are
    obvious to beginners are drawn so they can be broken and the stops parked just
    behind them can be taken.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.091
  category: trend
  title_en: Counter-trendlines. Scalp entries are built on breaks of trendlines that
    run against the day’s main path.
  title_ar: 'خطوط الاتجاه: Counter-trendlines. Scalp entries are built on breaks of
    trendlines that run against the day’s main path.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.092
  category: trend
  title_en: Channel median. The midline acts as a price magnet. A bounce from it confirms
    trend strength and a run to the opposite side.
  title_ar: 'خطوط الاتجاه: Channel median. The midline acts as a price magnet. A bounce
    from it confirms trend strength and a run to the opposite side.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.093
  category: trend
  title_en: Trendline crossing a horizontal level. The mathematical intersection of
    a sloping trendline and horizontal support is the highest-probability entry (confluence
    zone).
  title_ar: 'خطوط الاتجاه: Trendline crossing a horizontal level. The mathematical
    intersection of a sloping trendline and horizontal support is the highest-probability
    entry (confluence zone).'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.094
  category: trend
  title_en: Break and retest of the trendline. After a rising trendline breaks, the
    entry is the later tag of that line from below, now acting as resistance.
  title_ar: 'خطوط الاتجاه: Break and retest of the trendline. After a rising trendline
    breaks, the entry is the later tag of that line from below, now acting as resistance.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.095
  category: trend
  title_en: Wicks versus bodies. On gold, trendlines drawn on body closes are more
    honest about a real break than lines drawn on random wicks.
  title_ar: 'خطوط الاتجاه: Wicks versus bodies. On gold, trendlines drawn on body
    closes are more honest about a real break than lines drawn on random wicks.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.096
  category: trend
  title_en: Speed resistance fan. Draw three trendlines at different angles. A break
    of the first warns of a drop to the second. A break of the second targets the
    third.
  title_ar: 'خطوط الاتجاه: Speed resistance fan. Draw three trendlines at different
    angles. A break of the first warns of a drop to the second. A break of the second
    targets the third.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.097
  category: trend
  title_en: RSI trendline. Draw trendlines on RSI. A break of the indicator’s trendline
    leads the actual price trendline break by two to three candles.
  title_ar: 'خطوط الاتجاه: RSI trendline. Draw trendlines on RSI. A break of the indicator’s
    trendline leads the actual price trendline break by two to three candles.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.098
  category: trend
  title_en: Higher-timeframe trendlines. A trendline drawn on D1 remains a hard barrier.
    It is not easily crossed except by a violent macro release.
  title_ar: 'خطوط الاتجاه: Higher-timeframe trendlines. A trendline drawn on D1 remains
    a hard barrier. It is not easily crossed except by a violent macro release.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.099
  category: trend
  title_en: Price diverging away from the trendline. A very large distance above a
    rising trendline bans immediate buying until price breathes back toward the line.
  title_ar: 'خطوط الاتجاه: Price diverging away from the trendline. A very large distance
    above a rising trendline bans immediate buying until price breathes back toward
    the line.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.100
  category: trend
  title_en: Break of a double-top trendline. A break of the trendline connecting the
    two troughs of a double top activates the sell even before the neckline breaks.
  title_ar: 'خطوط الاتجاه: Break of a double-top trendline. A break of the trendline
    connecting the two troughs of a double top activates the sell even before the
    neckline breaks.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.101
  category: trend
  title_en: A broken trendline reverses its job. A rising trendline broken with force
    later becomes a resistance ceiling that rejects new rally attempts.
  title_ar: 'خطوط الاتجاه: A broken trendline reverses its job. A rising trendline
    broken with force later becomes a resistance ceiling that rejects new rally attempts.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.102
  category: trend
  title_en: Symmetrical-triangle trendlines. A narrowing gap between the rising and
    falling trendlines inside a triangle warns of an explosion whose direction is
    the side that breaks.
  title_ar: 'خطوط الاتجاه: Symmetrical-triangle trendlines. A narrowing gap between
    the rising and falling trendlines inside a triangle warns of an explosion whose
    direction is the side that breaks.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.103
  category: trend
  title_en: Trendlines as moving targets. On a buy, the upper descending trendline
    can be the moving profit target as time passes.
  title_ar: 'خطوط الاتجاه: Trendlines as moving targets. On a buy, the upper descending
    trendline can be the moving profit target as time passes.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.104
  category: trend
  title_en: Trendline break on a doji. A break by weak doji candles is a false break
    caused by missing liquidity, not a real shift in control.
  title_ar: 'خطوط الاتجاه: Trendline break on a doji. A break by weak doji candles
    is a false break caused by missing liquidity, not a real shift in control.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.105
  category: trend
  title_en: Trendline aligned with the session. A touch of a rising trendline in the
    first minute of the London open gives the trade maximum thrust.
  title_ar: 'خطوط الاتجاه: Trendline aligned with the session. A touch of a rising
    trendline in the first minute of the London open gives the trade maximum thrust.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.106
  category: gold
  title_en: Asian-range liquidity sweep. On about 80% of days, gold at the London
    open breaks the Asian high or Asian low to grab liquidity, then reverses completely.
  title_ar: 'سلوك الذهب: Asian-range liquidity sweep. On about 80% of days, gold at
    the London open breaks the Asian high or Asian low to grab liquidity, then reverses
    completely.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.107
  category: gold
  title_en: Gold does not forgive a late stop. Once the reversal starts, a 20-point
    loss is better than waiting. Gold can travel 300 points without pausing.
  title_ar: 'سلوك الذهب: Gold does not forgive a late stop. Once the reversal starts,
    a 20-point loss is better than waiting. Gold can travel 300 points without pausing.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.108
  category: gold
  title_en: Major psychological-number traps. Around levels such as 2400.00, gold
    repeatedly fakes breaks by 50 to 80 points to flush retail contracts before the
    real move.
  title_ar: 'سلوك الذهب: Major psychological-number traps. Around levels such as 2400.00,
    gold repeatedly fakes breaks by 50 to 80 points to flush retail contracts before
    the real move.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.109
  category: gold
  title_en: The 3:30 p.m. Mecca-time candle (New York open). This candle often erases
    everything London built, in minutes. Close or fully protect intraday contracts
    before it.
  title_ar: 'سلوك الذهب: The 3:30 p.m. Mecca-time candle (New York open). This candle
    often erases everything London built, in minutes. Close or fully protect intraday
    contracts before it.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.110
  category: gold
  title_en: Gold is a fear haven, not an intraday inflation trade. In moments of urgent
    military tension, technical analysis is suspended. Gold is bought as a fact, driven
    by institutional market orders.
  title_ar: 'سلوك الذهب: Gold is a fear haven, not an intraday inflation trade. In
    moments of urgent military tension, technical analysis is suspended. Gold is bought
    as a fact, driven by institutional market orders.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.111
  category: gold
  title_en: Temporary decoupling from DXY. Gold can rise with the dollar during severe
    banking panic. Do not treat the inverse relationship as a 100% sacred rule.
  title_ar: 'سلوك الذهب: Temporary decoupling from DXY. Gold can rise with the dollar
    during severe banking panic. Do not treat the inverse relationship as a 100% sacred
    rule.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.112
  category: gold
  title_en: Gold’s normal volatility (gold ATR). Gold’s natural daily range is about
    250 to 400 points. A move under 150 points means the market has not started its
    explosion.
  title_ar: 'سلوك الذهب: Gold’s normal volatility (gold ATR). Gold’s natural daily
    range is about 250 to 400 points. A move under 150 points means the market has
    not started its explosion.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.113
  category: gold
  title_en: News-wick trap. The first move in the 5 seconds after CPI or a rate decision
    is often a reverse trap that swallows liquidity before the real direction.
  title_ar: 'سلوك الذهب: News-wick trap. The first move in the 5 seconds after CPI
    or a rate decision is often a reverse trap that swallows liquidity before the
    real direction.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.114
  category: gold
  title_en: Equal highs and equal lows are targets. Gold does not leave equal highs
    or equal lows without returning to break them and run the stops behind them, even
    days later.
  title_ar: 'سلوك الذهب: Equal highs and equal lows are targets. Gold does not leave
    equal highs or equal lows without returning to break them and run the stops behind
    them, even days later.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.115
  category: gold
  title_en: Sharp liquidity void. Very long candles left during news are attraction
    zones. Price later returns to fill at least 50% of them.
  title_ar: 'سلوك الذهب: Sharp liquidity void. Very long candles left during news
    are attraction zones. Price later returns to fill at least 50% of them.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.116
  category: gold
  title_en: Gold likes the 78.6% Fibonacci retracement. Unlike currencies that often
    stop at 50% or 61.8%, gold prefers very deep pullbacks that hit the largest number
    of stops before launching.
  title_ar: 'سلوك الذهب: Gold likes the 78.6% Fibonacci retracement. Unlike currencies
    that often stop at 50% or 61.8%, gold prefers very deep pullbacks that hit the
    largest number of stops before launching.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.117
  category: gold
  title_en: Daily fixing flow. From 6:00 to 7:00 p.m. London time, spot gold is fixed
    and sudden contract liquidations occur. (Translated as written.)
  title_ar: 'سلوك الذهب: Daily fixing flow. From 6:00 to 7:00 p.m. London time, spot
