  weight: 1
- id: field.191
  category: execution
  title_en: Respect the daily loss cap. If the account reaches a 3% daily drawdown,
    the agent closes every trade and disconnects until the next morning.
  title_ar: 'التنفيذ: Respect the daily loss cap. If the account reaches a 3% daily
