- id: field.187
  category: execution
  title_en: Revenge trading is banned in code. Freeze the platform and block new orders
    for 60 minutes after two consecutive losses in the same session.
  title_ar: 'التنفيذ: Revenge trading is banned in code. Freeze the platform and block
