  params: {}
  default_enabled: true
  weight: 1
- id: field.185
  category: execution
  title_en: Separate scalps from swings. Each strategy has its own magic number. Do
    not merge an intraday stop with a longer-term stop.
  title_ar: 'التنفيذ: Separate scalps from swings. Each strategy has its own magic
    number. Do not merge an intraday stop with a longer-term stop.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: field.186
  category: execution
  title_en: Immediate exit on a leaked hot headline. If gold moves 80 points in one
    minute with no technical reason and no scheduled release, close positions immediately.
    An emergency headline may have leaked.
  title_ar: 'التنفيذ: Immediate exit on a leaked hot headline. If gold moves 80 points
