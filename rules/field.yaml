  type: guardrail
  params: {}
  default_enabled: true
  weight: 1
- id: field.188
  category: execution
  title_en: Dual lot-size check. The position-size calculation is reviewed twice in
    code before send, so a decimal-point error cannot become an account disaster.
  title_ar: 'التنفيذ: Dual lot-size check. The position-size calculation is reviewed
