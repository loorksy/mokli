  weight: 1
- id: field.184
  category: execution
  title_en: No double entry on the same instrument. Do not open a new gold buy if
    a prior gold buy is still open and losing. Do not stack losses.
  title_ar: 'التنفيذ: No double entry on the same instrument. Do not open a new gold
