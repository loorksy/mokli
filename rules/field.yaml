- id: field.182
  category: execution
  title_en: Zero-hesitation execution. Once the algorithmic conditions are met, send
    the order immediately. Do not wait for a late human consultation.
  title_ar: 'التنفيذ: Zero-hesitation execution. Once the algorithmic conditions are
    met, send the order immediately. Do not wait for a late human consultation.'
  type: heuristic
  params: {}
  default_enabled: true
