  type: guardrail
  params: {}
  default_enabled: true
  weight: 1
- id: field.189
  category: execution
  title_en: Refresh the live feed before send. Check the latest MT5 tick. If the data
    is older than 5 seconds, cancel execution. The connection may be down.
  title_ar: 'التنفيذ: Refresh the live feed before send. Check the latest MT5 tick.
