- id: field.181
  category: execution
  title_en: Standing aside is itself a trade. When the picture is unclear and signals
    conflict, staying a spectator is a profitable decision. It protects capital.
  title_ar: 'التنفيذ: Standing aside is itself a trade. When the picture is unclear
    and signals conflict, staying a spectator is a profitable decision. It protects
    capital.'
