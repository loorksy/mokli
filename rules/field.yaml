- id: field.183
  category: execution
  title_en: Auto-cancel pending orders. Any pending order (buy limit / sell limit)
    that has not filled within 3 hours of being placed is cancelled in code. The technical
    context has expired.
  title_ar: 'التنفيذ: Auto-cancel pending orders. Any pending order (buy limit / sell
