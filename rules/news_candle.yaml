  title_ar: 'الحجم: Volume explosion on a historical-high break. The day’s highest
    tick reading prints at the moment a major level breaks, driven by economic data.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.040
  category: volume
  title_en: Heavy delta imbalance. One side of the market (buy or sell) controls more
