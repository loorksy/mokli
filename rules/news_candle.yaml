  params: {}
  default_enabled: true
  weight: 1
- id: candle.016
  category: range
  title_en: The 3× ATR rule. If the candle’s range (high minus low) is greater than
    3 times the 14-period ATR, it is a confirmed news candle.
  title_ar: 'المدى: The 3× ATR rule. If the candle’s range (high minus low) is greater
    than 3 times the 14-period ATR, it is a confirmed news candle.'
  type: detector
  params: {}
  default_enabled: true
  weight: 1
- id: candle.017
  category: range
  title_en: One-minute range outlier. Gold moving more than 60 to 80 points in a single
    one-minute candle, outside dead hours, is a direct fingerprint of a news candle.
  title_ar: 'المدى: One-minute range outlier. Gold moving more than 60 to 80 points
    in a single one-minute candle, outside dead hours, is a direct fingerprint of
    a news candle.'
  type: detector
  params: {}
  default_enabled: true
  weight: 1
- id: candle.018
  category: range
  title_en: Intraday daily-range break. If a 5-minute candle covers more than 40%
    of gold’s average daily range in one push, record it immediately as a news candle.
  title_ar: 'المدى: Intraday daily-range break. If a 5-minute candle covers more than
    40% of gold’s average daily range in one push, record it immediately as a news
    candle.'
  type: detector
  params: {}
  default_enabled: true
  weight: 1
- id: candle.019
  category: range
  title_en: Distance velocity. Price moving faster than 1.5 points per second, continuously,
