  title_ar: 'المدى: Distance velocity. Price moving faster than 1.5 points per second,
    continuously, with no pullback, for 30 seconds.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.020
  category: range
  title_en: Range versus the last 20 candles. If the current candle’s size equals
    the combined length of the previous 10 candles, the driver is an external news
    engine.
  title_ar: 'المدى: Range versus the last 20 candles. If the current candle’s size
    equals the combined length of the previous 10 candles, the driver is an external
    news engine.'
  type: detector
  params: {}
  default_enabled: true
  weight: 1
- id: candle.021
  category: range
  title_en: Hidden intraday gap. Price jumps from one tick to the next with no trades
    in the space between, leaving a price void inside the intraday candle.
  title_ar: 'المدى: Hidden intraday gap. Price jumps from one tick to the next with
    no trades in the space between, leaving a price void inside the intraday candle.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.022
  category: range
  title_en: Instant break of Bollinger extremes (beyond 3.5 standard deviations).
