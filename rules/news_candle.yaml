    as commodity news.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.014
  category: time
  title_en: Unscheduled central-bank governor speeches. The candle that coincides
    with a live broadcast or a published text from the Fed Chair at an economic forum.
  title_ar: 'توقيت الشمعة: Unscheduled central-bank governor speeches. The candle
