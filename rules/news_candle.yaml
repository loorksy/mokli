    it feeds through to gold.
  title_ar: 'توقيت الشمعة: European Central Bank decision. The Thursday 2:15 p.m.
    Central European Time candle on meeting days is treated as a monetary shock for
    currencies, and it feeds through to gold.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.013
  category: time
  title_en: OPEC+ meeting candle. Explosive candles on OPEC meeting days, caused by
    production decisions that are not scheduled to the hour, are classified as commodity
    news.
  title_ar: 'توقيت الشمعة: OPEC+ meeting candle. Explosive candles on OPEC meeting
