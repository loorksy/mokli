- id: candle.001
  category: time
  title_en: The zero minute of US data (the 8:30 a.m. / 10:00 a.m. EST rule). If a
    wide-range candle forms at minute 00 or 30 together with a major US release time,
    classify it as a news candle immediately.
  title_ar: 'توقيت الشمعة: The zero minute of US data (the 8:30 a.m. / 10:00 a.m.
    EST rule). If a wide-range candle forms at minute 00 or 30 together with a major
    US release time, classify it as a news candle immediately.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.002
  category: time
  title_en: The minute-45 candle (flash PMI releases). Explosive candles at minute
    45 (for example 9:45 a.m. New York) are usually preliminary purchasing-managers
    releases and are treated as news candles.
  title_ar: 'توقيت الشمعة: The minute-45 candle (flash PMI releases). Explosive candles
    at minute 45 (for example 9:45 a.m. New York) are usually preliminary purchasing-managers
    releases and are treated as news candles.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.003
  category: time
  title_en: Federal Reserve decision window (FOMC, 2:00 p.m. EST). Any candle that
    forms at exactly 2:00 p.m. Washington time, every six weeks, is the rate-decision
    candle, regardless of its shape.
  title_ar: 'توقيت الشمعة: Federal Reserve decision window (FOMC, 2:00 p.m. EST).
    Any candle that forms at exactly 2:00 p.m. Washington time, every six weeks, is
    the rate-decision candle, regardless of its shape.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.004
  category: time
  title_en: Fed press-conference candle (2:30 p.m.). The sequence of candles that
    starts at 2:30 p.m. and runs for 45 minutes is live remarks and is classified
    as a chain of news candles.
  title_ar: 'توقيت الشمعة: Fed press-conference candle (2:30 p.m.). The sequence of
    candles that starts at 2:30 p.m. and runs for 45 minutes is live remarks and is
    classified as a chain of news candles.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.005
  category: time
  title_en: Jobs-report candle (first Friday of the month). The 8:30 a.m. New York
    candle on the first Friday of each calendar month is officially the NFP candle.
    No extra technical confirmation is required.
  title_ar: 'توقيت الشمعة: Jobs-report candle (first Friday of the month). The 8:30
    a.m. New York candle on the first Friday of each calendar month is officially
    the NFP candle. No extra technical confirmation is required.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.006
  category: time
  title_en: London-open news flow. Large candles between 8:00 and 8:15 a.m. London
    time that coincide with UK GDP or UK inflation are classified as a European macro
    candle.
  title_ar: 'توقيت الشمعة: London-open news flow. Large candles between 8:00 and 8:15
    a.m. London time that coincide with UK GDP or UK inflation are classified as a
    European macro candle.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.007
  category: time
  title_en: London PM gold fix. At 3:00 p.m. London time, sudden high-volume candles
    reflect interbank spot-gold reprice flows.
  title_ar: 'توقيت الشمعة: London PM gold fix. At 3:00 p.m. London time, sudden high-volume
    candles reflect interbank spot-gold reprice flows.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.008
  category: time
  title_en: US Treasury auction candles. Explosive candles at 1:00 p.m. New York time
    are tied to 10-year or 30-year Treasury auction results.
  title_ar: 'توقيت الشمعة: US Treasury auction candles. Explosive candles at 1:00
    p.m. New York time are tied to 10-year or 30-year Treasury auction results.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.009
  category: time
  title_en: Monthly contract-expiry candle (options expiry / futures expiration).
    Abnormal volatility on the last Friday of the month, at gold futures expiry, is
    classified as liquidation and settlement flow.
  title_ar: 'توقيت الشمعة: Monthly contract-expiry candle (options expiry / futures
    expiration). Abnormal volatility on the last Friday of the month, at gold futures
    expiry, is classified as liquidation and settlement flow.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.010
  category: time
  title_en: Calendar API sync. If the gap between the start of the candle and a red
    (high-impact) calendar event is under 60 seconds, classify it as a news candle
    automatically.
  title_ar: 'توقيت الشمعة: Calendar API sync. If the gap between the start of the
    candle and a red (high-impact) calendar event is under 60 seconds, classify it
    as a news candle automatically.'
  type: detector
  params: {}
  default_enabled: true
  weight: 1
- id: candle.011
  category: time
  title_en: Oil-inventory report and its spillover. Wednesday, 10:30 a.m. US Eastern.
