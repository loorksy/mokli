  title_ar: 'الحجم: Trading density at the candle extremes. Ticks cluster at the upper
    or lower wick, showing a fast liquidation battle during the release.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: candle.044
  category: volume
  title_en: Volume jump with a brief price freeze. Ticks freeze for two seconds because
