    a sustained uptrend automatically.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.051
  category: micro
  title_en: Paralyzed volatility (compression trap). If gold does not move after an
    important print and stays inside a 20-point range, a violent delayed explosion
