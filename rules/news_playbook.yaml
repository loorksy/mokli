- id: news.001
  category: pre
  title_en: Mandatory pre-news freeze window. No new trades in the 15 minutes before
    high-impact releases (CPI, NFP, FOMC), to avoid liquidity-sweep chaos.
  title_ar: 'ما قبل الخبر: Mandatory pre-news freeze window. No new trades in the
    15 minutes before high-impact releases (CPI, NFP, FOMC), to avoid liquidity-sweep
    chaos.'
  type: guardrail
  params: {}
  default_enabled: true
  weight: 1
- id: news.002
  category: pre
  title_en: Cancel all pending orders. Delete every buy and sell pending order (limit
    and stop) 10 minutes before the release, so slippage cannot activate them.
  title_ar: 'ما قبل الخبر: Cancel all pending orders. Delete every buy and sell pending
    order (limit and stop) 10 minutes before the release, so slippage cannot activate
    them.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.003
  category: pre
  title_en: Protect open winners. Move the stop of trades already open to entry, or
    close 70% of size, 10 minutes before pivotal data.
  title_ar: 'ما قبل الخبر: Protect open winners. Move the stop of trades already open
    to entry, or close 70% of size, 10 minutes before pivotal data.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.004
  category: pre
  title_en: Flatten trades sitting near entry. Close any trade that is not more than
    30 gold points away from entry, so spread expansion does not hit the stop immediately.
  title_ar: 'ما قبل الخبر: Flatten trades sitting near entry. Close any trade that
    is not more than 30 gold points away from entry, so spread expansion does not
    hit the stop immediately.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.005
  category: pre
  title_en: Watch spread expansion in advance. Measure the spread two minutes before
    the release. If it is more than 3 times normal, arm the automatic trading lock
    immediately.
  title_ar: 'ما قبل الخبر: Watch spread expansion in advance. Measure the spread two
    minutes before the release. If it is more than 3 times normal, arm the automatic
    trading lock immediately.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.006
  category: pre
  title_en: Priced-in analysis. Compare the prior 4 hours of price with the consensus.
    A sharp directional move before the release means the market has already absorbed
    the result.
  title_ar: 'ما قبل الخبر: Priced-in analysis. Compare the prior 4 hours of price
    with the consensus. A sharp directional move before the release means the market
    has already absorbed the result.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.007
  category: pre
  title_en: Mark the quiet pre-news range. Draw the highest high and lowest low of
    the last 30 minutes before the release. Those become break boundaries and liquidity
    traps.
  title_ar: 'ما قبل الخبر: Mark the quiet pre-news range. Draw the highest high and
    lowest low of the last 30 minutes before the release. Those become break boundaries
    and liquidity traps.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.008
  category: pre
  title_en: Disable a tight trailing stop. Turn off intraday trailing immediately
    before the release. The first random spike will hit the trail and steal the later
    trend.
  title_ar: 'ما قبل الخبر: Disable a tight trailing stop. Turn off intraday trailing
    immediately before the release. The first random spike will hit the trail and
    steal the later trend.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.009
  category: pre
  title_en: Filter simultaneous releases. Raise the danger rating when two prints
    land together (for example the unemployment rate alongside NFP).
  title_ar: 'ما قبل الخبر: Filter simultaneous releases. Raise the danger rating when
    two prints land together (for example the unemployment rate alongside NFP).'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.010
  category: pre
  title_en: Check connection quality and ping. MT5 server latency must be under 50
    ms one minute before the release. If delay is higher, trading is fully banned.
  title_ar: 'ما قبل الخبر: Check connection quality and ping. MT5 server latency must
    be under 50 ms one minute before the release. If delay is higher, trading is fully
    banned.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.011
  category: pre
  title_en: Do not trade if the release coincides with the daily rollover. No entry
    if the print lands on the contract roll and swap update.
  title_ar: 'ما قبل الخبر: Do not trade if the release coincides with the daily rollover.
    No entry if the print lands on the contract roll and swap update.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.012
  category: pre
  title_en: Consensus deviation threshold. Code the forecast-versus-actual gap required
    to move the market for real (for example a 50,000-job miss or beat on NFP).
  title_ar: 'ما قبل الخبر: Consensus deviation threshold. Code the forecast-versus-actual
    gap required to move the market for real (for example a 50,000-job miss or beat
    on NFP).'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.013
  category: pre
  title_en: Silence during the Fed Chair’s testimony. Stay completely quiet for the
    entire congressional testimony and until the press conference is fully over.
  title_ar: 'ما قبل الخبر: Silence during the Fed Chair’s testimony. Stay completely
    quiet for the entire congressional testimony and until the press conference is
    fully over.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.014
  category: pre
  title_en: Watch DXY liquidity rushing in before the print. If the dollar index is
    breaking lows minutes before the release with no visible reason, treat it as an
    early leak of dollar-negative data that supports gold higher.
  title_ar: 'ما قبل الخبر: Watch DXY liquidity rushing in before the print. If the
    dollar index is breaking lows minutes before the release with no visible reason,
    treat it as an early leak of dollar-negative data that supports gold higher.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.015
  category: pre
  title_en: Mark macro extreme zones. Draw the nearest daily support and resistance
    150 to 300 points from the current price, in case the news candle tags them.
  title_ar: 'ما قبل الخبر: Mark macro extreme zones. Draw the nearest daily support
    and resistance 150 to 300 points from the current price, in case the news candle
    tags them.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.016
  category: pre
  title_en: Exceptional lot-size cap. Cut allowed risk in half (0.5% instead of 1%)
    for any execution on a major-data day.
  title_ar: 'ما قبل الخبر: Exceptional lot-size cap. Cut allowed risk in half (0.5%
    instead of 1%) for any execution on a major-data day.'
  type: guardrail
  params: {}
  default_enabled: true
  weight: 1
- id: news.017
  category: pre
  title_en: Stop-market trap ban. Do not place buy-stop or sell-stop orders to catch
    the news explosion. They fill at the worst slippage.
  title_ar: 'ما قبل الخبر: Stop-market trap ban. Do not place buy-stop or sell-stop
    orders to catch the news explosion. They fill at the worst slippage.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.018
  category: pre
  title_en: Separate scheduled news from surprises. Code a distinction between calendar
    events and geopolitical shocks that require immediate action with no timetable.
  title_ar: 'ما قبل الخبر: Separate scheduled news from surprises. Code a distinction
    between calendar events and geopolitical shocks that require immediate action
    with no timetable.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.019
  category: data
  title_en: CPI shock logic. Inflation above forecast means higher yields and a stronger
    dollar, and a sharp, fast drop in gold. The opposite is also true.
  title_ar: 'قراءة البيانات: CPI shock logic. Inflation above forecast means higher
    yields and a stronger dollar, and a sharp, fast drop in gold. The opposite is
    also true.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.020
  category: data
  title_en: NFP dynamics. Very strong hiring with falling unemployment supports a
    delay in rate cuts, and immediate selling pressure on gold.
  title_ar: 'قراءة البيانات: NFP dynamics. Very strong hiring with falling unemployment
    supports a delay in rate cuts, and immediate selling pressure on gold.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.021
  category: data
  title_en: Split-data paralysis. If payrolls are dollar-positive and average earnings
    are dollar-negative, classify the market as “conflicted, high risk” and cancel
    every trade automatically.
  title_ar: 'قراءة البيانات: Split-data paralysis. If payrolls are dollar-positive
    and average earnings are dollar-negative, classify the market as “conflicted,
    high risk” and cancel every trade automatically.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.022
  category: data
  title_en: Revisions matter. Watch the prior month’s revision. A downward revision
    of last month immediately cancels a positive current print and flips the bias
    toward gold.
  title_ar: 'قراءة البيانات: Revisions matter. Watch the prior month’s revision. A
    downward revision of last month immediately cancels a positive current print and
    flips the bias toward gold.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.023
  category: data
  title_en: The rate decision versus the press conference. The hold or hike sets the
    first move. The Chair’s tone 30 minutes later sets the day’s final direction.
  title_ar: 'قراءة البيانات: The rate decision versus the press conference. The hold
    or hike sets the first move. The Chair’s tone 30 minutes later sets the day’s
    final direction.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.024
  category: data
  title_en: Buy the rumor, sell the fact. If gold has already rallied hard into a
    rate cut priced at 99%, the moment of the actual print often brings a distribution
    decline as profits are taken.
  title_ar: 'قراءة البيانات: Buy the rumor, sell the fact. If gold has already rallied
    hard into a rate cut priced at 99%, the moment of the actual print often brings
    a distribution decline as profits are taken.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.025
  category: data
  title_en: Surprise-delta score. Do not react if the print matches consensus exactly.
    A match means stability and a tight, directionless range.
  title_ar: 'قراءة البيانات: Surprise-delta score. Do not react if the print matches
    consensus exactly. A match means stability and a tight, directionless range.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.026
  category: data
  title_en: PMI reading. A purchasing-managers index below 50.0 signals economic contraction
    and pushes gold up quickly as an investment haven.
  title_ar: 'قراءة البيانات: PMI reading. A purchasing-managers index below 50.0 signals
    economic contraction and pushes gold up quickly as an investment haven.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.027
  category: data
  title_en: Ignore secondary numbers. Filter out consumer confidence and home sales
    if they land in the same week as major inflation and employment data.
  title_ar: 'قراءة البيانات: Ignore secondary numbers. Filter out consumer confidence
    and home sales if they land in the same week as major inflation and employment
    data.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.028
  category: data
  title_en: Immediate yield divergence. If the print is dollar-positive but 10-year
    yields fall, gold’s decline will be temporary and it will bounce quickly.
  title_ar: 'قراءة البيانات: Immediate yield divergence. If the print is dollar-positive
    but 10-year yields fall, gold’s decline will be temporary and it will bounce quickly.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.029
  category: data
  title_en: PPI as an early CPI warning. Positive PPI surprises pave the way for gradual
    downside waves in gold ahead of CPI.
  title_ar: 'قراءة البيانات: PPI as an early CPI warning. Positive PPI surprises pave
    the way for gradual downside waves in gold ahead of CPI.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.030
  category: data
  title_en: Absorption speed. Measure how long price takes to return to the print
    level. Negative data absorbed in under 5 minutes shows overwhelming institutional
    buying.
  title_ar: 'قراءة البيانات: Absorption speed. Measure how long price takes to return
    to the print level. Negative data absorbed in under 5 minutes shows overwhelming
    institutional buying.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.031
  category: data
  title_en: Weekly jobless claims. Unusually large jumps in claims show a weaker labor
    market and give gold an immediate buy bid.
  title_ar: 'قراءة البيانات: Weekly jobless claims. Unusually large jumps in claims
    show a weaker labor market and give gold an immediate buy bid.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.032
  category: data
  title_en: Fed speeches via keywords. Flag dovish phrases such as “slowdown,” “downside
    risks,” and “watching employment” as support for an intraday buy.
  title_ar: 'قراءة البيانات: Fed speeches via keywords. Flag dovish phrases such as
    “slowdown,” “downside risks,” and “watching employment” as support for an intraday
    buy.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.033
  category: data
  title_en: Rate-futures probability shift. Track the FedWatch tool immediately after
    the print. A jump in cut odds supports gold staying bid for the rest of the session.
  title_ar: 'قراءة البيانات: Rate-futures probability shift. Track the FedWatch tool
    immediately after the print. A jump in cut odds supports gold staying bid for
    the rest of the session.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.034
  category: data
  title_en: Isolate the dollar’s intraday effect. If gold falls while the dollar falls
    at the same time, the driver is a broad liquidity liquidation, not a normal data
    response.
  title_ar: 'قراءة البيانات: Isolate the dollar’s intraday effect. If gold falls while
    the dollar falls at the same time, the driver is a broad liquidity liquidation,
    not a normal data response.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.035
  category: micro
  title_en: The dead first minute (the 60-second void). A hard ban on any entry or
    analysis during the first 60 seconds after the print. Candles in that minute are
    algorithmic chaos.
  title_ar: 'شمعة الخبر: The dead first minute (the 60-second void). A hard ban on
    any entry or analysis during the first 60 seconds after the print. Candles in
    that minute are algorithmic chaos.'
  type: guardrail
  params: {}
  default_enabled: true
  weight: 1
- id: news.036
  category: micro
  title_en: Two-sided liquidity sweep. A candle that takes the pre-news high and,
    in the same minute, takes the pre-news low is a liquidation of traders’ contracts,
    not a trend.
  title_ar: 'شمعة الخبر: Two-sided liquidity sweep. A candle that takes the pre-news
    high and, in the same minute, takes the pre-news low is a liquidation of traders’
    contracts, not a trend.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.037
  category: micro
  title_en: The M5 close is the primary reference. The first 5-minute candle that
    closes after the print is the technical standard. Trade the direction of its body
    if the body is more than 70% of the range.
  title_ar: 'شمعة الخبر: The M5 close is the primary reference. The first 5-minute
    candle that closes after the print is the technical standard. Trade the direction
    of its body if the body is more than 70% of the range.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.038
  category: micro
  title_en: Long rejection-wick rule. If the news candle leaves an upper wick twice
    the body after a sudden spike, classify the spike as a trap and activate the sell
    immediately.
  title_ar: 'شمعة الخبر: Long rejection-wick rule. If the news candle leaves an upper
    wick twice the body after a sudden spike, classify the spike as a trap and activate
    the sell immediately.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.039
  category: micro
  title_en: News fair value gap. A huge price void on the one-minute candle defines
    a later reaction zone. Do not buy until price has filled 50% of that void.
  title_ar: 'شمعة الخبر: News fair value gap. A huge price void on the one-minute
    candle defines a later reaction zone. Do not buy until price has filled 50% of
    that void.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.040
  category: micro
  title_en: A real break of the pre-news range. The post-news direction counts only
    if an M15 candle closes entirely outside the range marked before the print.
  title_ar: 'شمعة الخبر: A real break of the pre-news range. The post-news direction
    counts only if an M15 candle closes entirely outside the range marked before the
    print.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.041
  category: micro
  title_en: Instant engulfing deception. If gold rises 100 points in one minute and
    the next candle engulfs that entire rise in minute two, the day’s real direction
    is down.
  title_ar: 'شمعة الخبر: Instant engulfing deception. If gold rises 100 points in
    one minute and the next candle engulfs that entire rise in minute two, the day’s
    real direction is down.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.042
  category: micro
  title_en: Do not enter the middle of a giant candle. If gold has already moved 150
    points, buying the high out of fear of missing out is banned. Entry is only on
    the pullback.
  title_ar: 'شمعة الخبر: Do not enter the middle of a giant candle. If gold has already
    moved 150 points, buying the high out of fear of missing out is banned. Entry
    is only on the pullback.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.043
  category: micro
  title_en: Consecutive tick volume. If tick volume fades immediately after the first
    candle, algorithmic fuel is spent and the move is about to stall.
  title_ar: 'شمعة الخبر: Consecutive tick volume. If tick volume fades immediately
    after the first candle, algorithmic fuel is spent and the move is about to stall.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.044
  category: micro
  title_en: Range reclaim reversal. If the print breaks a major daily low and price
    trades back above that low within 10 minutes, that is a decisive sell trap and
    a major buy.
  title_ar: 'شمعة الخبر: Range reclaim reversal. If the print breaks a major daily
    low and price trades back above that low within 10 minutes, that is a decisive
    sell trap and a major buy.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.045
  category: micro
  title_en: Wicks vanish in a sweeping trend. When the following minute candles open
    and run in one direction with no wicks, institutional flow is continuous. Ride
    it.
  title_ar: 'شمعة الخبر: Wicks vanish in a sweeping trend. When the following minute
