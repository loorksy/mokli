  title_ar: 'شمعة الخبر: The shock wick as support. The lowest point of a bullish
    news candle’s wick is the ideal stop for any later buy.'
  type: heuristic
  params: {}
  default_enabled: true
  weight: 1
- id: news.050
  category: micro
  title_en: Candles aligned with a trendline break. If the news explosion breaks a
    major H1 descending trendline and closes above it, the bias flips to a sustained
